name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set on realodaz-07/leluxe. Deploy ABORTED - the live site was NOT updated. Fix with: gh secret set CLOUDFLARE_API_TOKEN -R realodaz-07/leluxe"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is present - proceeding with deploy."

      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1a27e68352eb5c992f9f46417dc6dc7a
          command: pages deploy . --project-name=leluxe --branch=main
